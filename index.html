    <!-- Konversi Klik WhatsApp - Surabaya -->
    <script>
      var lastWhatsAppConversion = 0;

      function gtag_report_conversion(url) {
        var now = Date.now();

        // Mencegah satu klik tercatat dua kali
        if (now - lastWhatsAppConversion < 2000) {
          return false;
        }

        lastWhatsAppConversion = now;
        var redirected = false;

        var callback = function () {
          if (!redirected && url) {
            redirected = true;
            window.location.href = url;
          }
        };

        if (typeof gtag === "function") {
          gtag("event", "conversion", {
            send_to: "AW-18468288552/w0VbCOzWzYEdEKjwruZE",
            event_callback: callback,
          });

          // WhatsApp tetap terbuka jika callback Google terlambat
          setTimeout(callback, 1500);
        } else {
          callback();
        }

        return false;
      }

      // Otomatis mendeteksi seluruh link WhatsApp
      document.addEventListener(
        "click",
        function (event) {
          var target =
            event.target instanceof Element ? event.target : null;

          if (!target) return;

          var link = target.closest(
            'a[href*="wa.me/"],' +
              'a[href*="api.whatsapp.com/"],' +
              'a[href*="web.whatsapp.com/"],' +
              'a[href*="wa.link/"],' +
              'a[href^="whatsapp://"]'
          );

          if (!link) return;

          event.preventDefault();
          gtag_report_conversion(link.href);
        },
        true
      );
    </script>
